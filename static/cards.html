<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番号札＆QRコード印刷シート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        padding: 0 !important;
      }
      .card-item {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans p-6 min-h-screen">

  <!-- 操作バー (印刷時は非表示) -->
  <div class="no-print max-w-5xl mx-auto bg-white rounded-2xl shadow-md p-5 mb-6 border border-slate-200">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span>🖨️</span> 番号札＆QRコード印刷シート
        </h1>
        <p class="text-xs text-slate-500 mt-1">
          A4用紙に印刷して切り離し、ラミネート加工や番号札スタンドとしてご利用ください。
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 text-sm">
          <label class="font-bold text-slate-700">番号範囲:</label>
          <input type="number" id="fromNum" value="1" min="1" max="100" class="w-16 border rounded-lg px-2 py-1 text-center font-bold">
          <span>〜</span>
          <input type="number" id="toNum" value="30" min="1" max="100" class="w-16 border rounded-lg px-2 py-1 text-center font-bold">
        </div>
        <button onclick="generateCards()" class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-bold px-4 py-2 rounded-xl transition">
          再生成
        </button>
        <button onclick="window.print()" class="bg-amber-600 hover:bg-amber-700 text-white text-sm font-extrabold px-6 py-2 rounded-xl shadow transition flex items-center gap-2">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5 4v3H4a2 2 0 00-2 2v6a2 2 0 002 2h1v-4a1 1 0 011-1h8a1 1 0 011 1v4h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z"/></svg>
          印刷する (A4)
        </button>
      </div>
    </div>

    <!-- URL設定（Cloudflare Tunnelやngrokなどの公開URLがある場合用） -->
    <div class="mt-3 pt-3 border-t border-slate-100 flex items-center gap-3 text-xs text-slate-600">
      <label class="font-bold">QRコードのURL基点:</label>
      <input type="text" id="baseUrlInput" class="flex-1 border rounded px-2 py-1 text-xs font-mono" placeholder="例: https://xxxx.loca.lt や http://192.168.11.x:8000">
      <span class="text-slate-400">※空欄の場合は現在のアクセスURLを使用します</span>
    </div>
  </div>

  <!-- カード一覧グリッド -->
  <div id="cardsContainer" class="max-w-5xl mx-auto grid grid-cols-2 md:grid-cols-3 gap-4">
    <!-- JSでカードを動的生成 -->
  </div>

  <script>
    const baseUrlInput = document.getElementById('baseUrlInput');
    baseUrlInput.value = window.location.origin;

    function generateCards() {
      const from = parseInt(document.getElementById('fromNum').value || '1', 10);
      const to = parseInt(document.getElementById('toNum').value || '30', 10);
      const baseUrl = baseUrlInput.value.replace(/\/$/, '') || window.location.origin;

      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      for (let i = from; i <= to; i++) {
        const numStr = i < 10 ? '0' + i : String(i);
        const cardUrl = `${baseUrl}/call?num=${i}`;

        const card = document.createElement('div');
        card.className = "card-item bg-white border-2 border-dashed border-slate-400 rounded-2xl p-4 flex flex-col items-center justify-between shadow-sm min-h-[290px] text-center";
        card.innerHTML = `
          <div class="w-full flex items-center justify-between border-b border-slate-200 pb-1 mb-2">
            <span class="text-xs font-bold text-amber-700">🍕 学祭ピザスタンド</span>
            <span class="text-[10px] text-slate-400 font-mono">呼出番号札</span>
          </div>

          <div class="my-1">
            <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">お呼び出し番号</div>
            <div class="text-6xl font-black text-slate-900 tracking-wider">${numStr}</div>
          </div>

          <!-- QRコード配置場所 -->
          <div id="qrcode-${i}" class="p-2 bg-white rounded-xl shadow-inner border border-slate-200 flex items-center justify-center my-1"></div>

          <div class="mt-2 text-[10px] text-slate-600 leading-tight">
            <span class="font-bold text-slate-800">📱 スマホのカメラでQRを読み取ってください</span><br>
            焼き上がると画面・音・バイブでお知らせします！
          </div>
        `;

        container.appendChild(card);

        // QRコード生成
        new QRCode(document.getElementById(`qrcode-${i}`), {
          text: cardUrl,
          width: 96,
          height: 96,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    // 初回生成
    generateCards();
  </script>
</body>
</html>
